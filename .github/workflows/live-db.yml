name: Live database suite

# Runs every `// @live-db` script (`npm run test:live`) against a real local
# Supabase stack: Postgres with every migration and the seed applied, Auth,
# the Data API, Storage and the Edge Functions. These are the RLS and security
# invariant tests (ADRs in docs/adr/), so a migration that reopens one fails
# here instead of passing every other check.
#
# Runs on pull requests, and is reused (workflow_call) by
# develop-ci-automerge.yml so main is never fast-forwarded past a failing
# invariant. It starts its own stack rather than sharing e2e.yml's: the live
# scripts create and delete their own fixtures, and the Playwright smokes must
# not see them half way.
#
# `@slow` live scripts (the stress audit) stay on demand: `npm run test:slow`.
# Hosted preview/prod drift is schema-alignment.yml's job, so the live run of
# test-schema-alignment skips its hosted checks here.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  live-db:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Supabase CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Start local Supabase
        run: npx supabase start

      # Some scripts read the environment, others the .env file the app uses,
      # so write both. These are the local stack's well-known demo keys.
      - name: Export local Supabase env
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
          } | tee .env >> "$GITHUB_ENV"

      # The storage-cleanup (0167) and webhook-dispatch (0180) schedules call
      # the Edge Functions through pg_net, with the URL and key they read
      # from Vault. A hosted project's operator configures these once
      # (supabase/README.md "Scheduled Edge Function calls"); here they point
      # at this stack's own gateway.
      - name: Configure scheduled Edge Function calls
        run: |
          eval "$(npx supabase status -o env)"
          project_id=$(sed -n 's/^project_id = "\(.*\)"$/\1/p' supabase/config.toml)
          psql "$DB_URL" -v ON_ERROR_STOP=1 \
            -v url="http://supabase_kong_${project_id}:8000" -v key="${SERVICE_ROLE_KEY}" <<'SQL'
          create extension if not exists pg_net;
          select vault.create_secret(:'url', 'project_url');
          select vault.create_secret(:'key', 'service_role_key');
          SQL

      - name: Live scripts (npm run test:live)
        env:
          SCHEMA_ALIGN_SKIP_LIVE: "1"
          LIVE_REPORT_DIR: ${{ runner.temp }}/live-reports
        run: npm run test:live

      # Measurements some live scripts write (for example the BE-13 search
      # plans), kept in the log and the job summary whether or not they pass.
      - name: Live reports
        if: always()
        run: |
          shopt -s nullglob
          for report in "${{ runner.temp }}"/live-reports/*.md; do
            cat "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          done
