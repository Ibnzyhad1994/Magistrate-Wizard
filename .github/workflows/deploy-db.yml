name: Deploy database (production)

# Applies committed migrations and redeploys the edge functions to the
# PRODUCTION Supabase project. Until this workflow existed, migrations reached
# production by someone running `supabase db push` by hand, so a frontend
# depending on a new migration could deploy (via Vercel, on the same push to
# main) before the schema did.
#
# Manual dispatch only (BE-03): Actions → "Deploy database (production)" →
# Run workflow. It used to run on every push to main touching supabase/**,
# with its dry run behind the environment approval, so the approver signed off
# blind. It now runs in two jobs:
#
#   plan   `db push --dry-run` against production, written to the job summary.
#          Runs in the reviewer-free environment `production-plan`, so anyone
#          can see what production lacks without an approval. A migration
#          that already exists remotely under a different name fails here,
#          before anything is written.
#   apply  Only when the run was started with "apply" ticked, and only from
#          main. Runs in the environment `production`, whose required
#          reviewers approve after reading the plan. It plans again and stops
#          unless production still lacks exactly the planned list, then
#          `db push` and `functions deploy`.
#
# Leave "apply" unticked to see production's state without changing it.
#
# Environments (Settings → Environments; this cannot be verified or set from
# the repository). Both hold the three secrets below and allow only the
# branches that may deploy:
#   production-plan  no reviewers
#   production       REQUIRED REVIEWERS, so a human approves every
#                    production schema change after reading the plan
#
# Migrations are forward-only (DEVELOPMENT_WORKFLOW.md): there is no
# rollback step. A bad migration is fixed by a new forward migration.
#
# Secrets (in both environments):
#   SUPABASE_ACCESS_TOKEN  personal/CI access token (supabase.com → Account → Access Tokens)
#   SUPABASE_PROJECT_REF   the production project ref (the id in <ref>.supabase.co)
#   SUPABASE_DB_PASSWORD   the database password (Project Settings → Database)

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply the plan to production (from main, after the production environment's approval). Unticked: plan only."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-plan
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Apply runs only from main
        if: inputs.apply && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Apply was requested on $GITHUB_REF. Production is deployed from main only; run it there, or untick apply to plan."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Pinned Supabase CLI
        run: echo "SUPABASE_CLI=supabase@$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_ENV"

      - name: Check secrets are configured
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set on the 'production-plan' environment."
              exit 1
            fi
          done

      - name: Link to the production project
        run: npx --yes "$SUPABASE_CLI" link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Plan (what db push would apply)
        id: plan
        env:
          DB_PUSH_TARGET: production
        run: node scripts/db-push-plan.mjs plan --linked

  apply:
    needs: plan
    if: inputs.apply && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    concurrency:
      group: deploy-db-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Pinned Supabase CLI
        run: echo "SUPABASE_CLI=supabase@$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_ENV"

      - name: Check secrets are configured
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set on the 'production' environment."
              exit 1
            fi
          done

      - name: Link to the production project
        run: npx --yes "$SUPABASE_CLI" link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Production still lacks exactly the plan
        env:
          DB_PUSH_PLAN: ${{ needs.plan.outputs.plan }}
        run: node scripts/db-push-plan.mjs verify --linked

      - name: Apply migrations
        run: npx --yes "$SUPABASE_CLI" db push --linked --yes

      - name: Deploy edge function clerk-access-notify
        run: npx --yes "$SUPABASE_CLI" functions deploy clerk-access-notify --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy edge function webhook-dispatch
        run: npx --yes "$SUPABASE_CLI" functions deploy webhook-dispatch --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy edge function storage-cleanup
        run: npx --yes "$SUPABASE_CLI" functions deploy storage-cleanup --project-ref "$SUPABASE_PROJECT_REF"
