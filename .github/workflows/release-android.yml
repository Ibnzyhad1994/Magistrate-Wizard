name: Release Android (Alpha)

# Builds an installable APK on every `v*` tag push. Anyone can trigger this
# from any OS by pushing a tag — no local Android/Java toolchain needed.
#
# Signing decides what happens to the APK:
#   - ANDROID_KEYSTORE_BASE64 set   → signed APK, uploaded as a build artifact
#                                     AND attached to a GitHub Release
#                                     (marked prerelease).
#   - ANDROID_KEYSTORE_BASE64 unset → unsigned APK, uploaded as a build
#                                     artifact ONLY. An unsigned build must
#                                     never be published as a release: it
#                                     installs nowhere and android/app/
#                                     build.gradle falls back silently.
#
# HAS_KEYSTORE is computed once at job level so both the decode step and the
# release step gate on the same value (a step's own `env:` is not visible to
# its `if:`).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync native version from package.json / native/version.json
        run: npm run native:sync-version

      - name: Build web assets
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync Capacitor Android platform
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/keystore/alpha-release.keystore

      - name: Build release APK
        working-directory: android
        env:
          # Absolute path: Gradle's file() in app/build.gradle resolves
          # relative paths against the app/ module dir, not android/, so a
          # relative path here silently misses the keystore (falls back to
          # an unsigned build with no error — do not change back to relative).
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && format('{0}/android/keystore/alpha-release.keystore', github.workspace) || '' }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: magistrate-wizard-alpha-apk${{ env.HAS_KEYSTORE == 'true' && '' || '-unsigned' }}
          path: android/app/build/outputs/apk/release/app-release*.apk

      - name: Unsigned build notice
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the APK is unsigned and was NOT attached to a GitHub Release."

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          prerelease: true
          generate_release_notes: true
