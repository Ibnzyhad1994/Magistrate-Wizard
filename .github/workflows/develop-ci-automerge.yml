name: Develop CI + Auto-merge to Main

# On every push to `develop`: run the fast regression/functionality
# suite, and if it's all green, fast-forward `main` to match and push —
# which is what triggers the production Vercel deployment.
#
# Scope of the gate is deliberately the FAST suite only: lint, typecheck,
# and every pure-logic test script under scripts/tests/ that needs no
# live database (extraction/OCR pipeline correctness, tag proposals,
# docket-procedure logic, calendar sync/mapping, offline outbox, XSS
# sanitisation, and a handful of scripts with no npm alias yet, invoked
# directly with the same runner the aliased ones use). Explicitly OUT of
# scope: every script that opens a live Supabase connection — persona-
# workflow simulation, the clerk access / admin-magistrate docket-scoping
# / legislation-edit-permission integration tests, manual RLS probes, and
# the slow/"brutal" stress-test variants. Those need a real project and
# meaningfully longer runtime, and were left for manual or separately-
# scheduled runs rather than gating every push.
#
# The merge is fast-forward-only. If `main` has commits `develop` doesn't
# (i.e. someone pushed directly to main out of band), the merge step
# fails loudly instead of guessing how to reconcile history — fix that
# by rebasing develop onto main, don't change this workflow to force it.

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # High/critical advisories are reported but do not fail the gate while
      # the tree still carries known transitive findings we are not unblocking
      # this workflow on. Dependabot opens weekly PRs to work them down.
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Ingestion / extraction / OCR correctness suite
        run: npm run test:ingestion

      - name: Calendar mapping
        run: npm run test:calendar-map

      - name: Calendar sync
        run: npm run test:calendar-sync

      - name: Offline outbox
        run: npm run test:offline-outbox

      - name: Session idle lock and Remember me
        run: npm run test:session-idle

      - name: Session lock security
        run: npm run test:session-lock

      - name: Judgment and bench-note PDF export
        run: npm run test:export-pdf

      - name: Share item types
        run: npm run test:shares

      - name: Judgment version history helpers
        run: npm run test:judgment-versions

      - name: Remaining audit-phase helpers
        run: npm run test:audit-ops

      - name: Tag proposal (hard cases)
        run: npm run test:propose-tags-hard

      - name: Tag proposal (before/after comparison)
        run: npm run test:propose-tags-compare

      - name: Content-Security-Policy regression
        run: npm run test:csp

      - name: Document PDF viewer (authenticated pdf.js, not signed-URL iframe)
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-document-pdf-viewer.mjs

      - name: XSS sanitisation probes
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/pentest-xss-probes.mjs

      - name: Audit activity summaries
        run: npm run test:audit-activity

      - name: Case law facets
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-case-law-facets.mjs

      - name: Docket scope resolution
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-docket-scope.mjs

      - name: Walkthrough and tour overlay
        run: npm run test:walkthrough

      - name: Docket week helpers
        run: npm run test:docket-week

      - name: DOCX page preview sanitisation
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-docx-page-preview-sanitize.mjs

      - name: Persistent batch lifecycle
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-persistent-batch-lifecycle.mjs

      - name: Stale state and publication
        run: node --experimental-strip-types --import ./scripts/test-support/register.mjs scripts/tests/test-stale-state-and-publication.mjs

      - name: Build (catches anything the type checker alone would miss)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  merge-to-main:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward main to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --ff-only origin/develop
          git push origin main
