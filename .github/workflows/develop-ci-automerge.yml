name: Develop CI + Fast-forward to Main

# On every push to `develop` and every pull request into it: audit, lint,
# typecheck, run the script test suite, build, and (on develop) run the
# Playwright smokes (reused from e2e.yml, which already runs on its own for
# pull requests).
#
# `main` is NOT moved by a push. Moving main deploys production: Vercel builds
# the frontend from main, and deploy-db.yml runs `supabase db push` against the
# production project when the push touches supabase/**. So the fast-forward
# only runs when someone dispatches this workflow by hand on `develop`
# (Actions → "Develop CI + Fast-forward to Main" → Run workflow), which runs
# every gate below first. The production-database timing stays with whoever
# presses that button.
#
# The audit is its own job so it never hides the other gates. It blocks only
# on critical advisories in production dependencies; dev-only and high
# findings are written to the job summary without failing. The fast-forward
# still needs the blocking audit, the test job and the smokes to be green.
#
# The script suite is `npm test` (scripts/test-support/run-all.mjs). It
# discovers every scripts/tests/test-*.mjs and skips anything tagged
# `// @live-db` (needs a real Supabase project) or `// @slow` (the "brutal"
# stress variants). Those run on demand with `npm run test:live` /
# `npm run test:slow`. Hosted preview/prod drift is checked read-only by
# schema-alignment.yml so a lagging remote cannot freeze this merge.
#
# The merge is fast-forward-only. If `main` has commits `develop` doesn't
# (i.e. someone pushed directly to main out of band), the merge step fails
# loudly instead of guessing how to reconcile history — fix that by rebasing
# develop onto main, don't change this workflow to force it. main-drift.yml
# raises the alarm when main trails develop for more than a day or so.
#
# A failed develop run (push or dispatch) opens (or comments on) a GitHub
# issue titled "develop CI failing"; the next green develop run closes it.
# Pull request runs never touch the issue.

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # npm audit reads package-lock.json and the registry; no install needed.
      - name: npm audit (production dependencies, critical - blocking)
        run: npm audit --omit=dev --audit-level=critical

      # Everything else (dev dependencies, high and below) is reported in the
      # job summary but does not fail the gate. Dependabot opens PRs to work
      # them down.
      - name: npm audit (all dependencies - report only)
        if: ${{ !cancelled() }}
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-prod.json || true
          node - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const read = (f) => JSON.parse(fs.readFileSync(f, "utf8"));
          const all = read("audit-all.json");
          const prod = read("audit-prod.json");
          const levels = ["critical", "high", "moderate", "low"];
          const count = (r, l) => r.metadata?.vulnerabilities?.[l] ?? 0;
          console.log("## npm audit (report only)\n");
          console.log("| Scope | " + levels.join(" | ") + " |");
          console.log("| --- | " + levels.map(() => "---").join(" | ") + " |");
          console.log("| production | " + levels.map((l) => count(prod, l)).join(" | ") + " |");
          console.log("| all (incl. dev) | " + levels.map((l) => count(all, l)).join(" | ") + " |");
          const serious = Object.values(all.vulnerabilities ?? {}).filter((v) =>
            ["critical", "high"].includes(v.severity),
          );
          if (serious.length) {
            console.log("\n### Critical and high advisories\n");
            console.log("| Package | Severity | Production | Fix |");
            console.log("| --- | --- | --- | --- |");
            for (const v of serious) {
              const inProd = prod.vulnerabilities?.[v.name] ? "yes" : "no (dev only)";
              const fix =
                v.fixAvailable === true
                  ? "`npm audit fix`"
                  : v.fixAvailable
                    ? `${v.fixAvailable.name}@${v.fixAvailable.version}${v.fixAvailable.isSemVerMajor ? " (major)" : ""}`
                    : "none";
              console.log(`| ${v.name} | ${v.severity} | ${inProd} | ${fix} |`);
            }
          }
          EOF
          npm audit || echo "::warning::npm audit reports advisories (see the job summary); only production criticals block."

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: develop-ci-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Script test suite (npm test)
        run: npm test

      - name: Schema alignment (repo uniqueness and contracts)
        env:
          SCHEMA_ALIGN_SKIP_LIVE: "1"
        run: npm run test:schema-alignment

      - name: Build (catches anything the type checker alone would miss)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  # Playwright smokes (unauth against Vite only; auth against local Supabase
  # + seed). Reused from e2e.yml so PRs and the develop gate run the same jobs.
  # Pull requests already get them from e2e.yml's own pull_request trigger.
  e2e:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  # Manual only: moving main deploys production (Vercel, and deploy-db.yml
  # for supabase/** changes). Dispatch on develop to run it.
  merge-to-main:
    needs: [audit, test, e2e]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # Fast-forward to the commit this run tested, not whatever develop
      # points at by the time the gates finish.
      - name: Fast-forward main to the tested develop commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --ff-only "$GITHUB_SHA"
          git push origin main

  notify-failure:
    needs: [audit, test, e2e, merge-to-main]
    if: failure() && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "develop CI failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Develop CI failed on \`${context.sha.slice(0, 7)}\`.`,
              "",
              `Run: ${runUrl}`,
              "",
              "`main` cannot be fast-forwarded until develop is green again.",
              "This issue is closed automatically by the next successful run.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ ...context.repo, title, body });
              core.info(`Opened #${created.number}`);
            }

  # Runs after a green push (merge-to-main skipped) or a green dispatch
  # (merge-to-main succeeded).
  notify-recovered:
    needs: [audit, test, e2e, merge-to-main]
    if: >-
      !cancelled() && github.ref == 'refs/heads/develop' &&
      needs.audit.result == 'success' && needs.test.result == 'success' &&
      needs.e2e.result == 'success' &&
      (needs.merge-to-main.result == 'success' || needs.merge-to-main.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          MERGED: ${{ needs.merge-to-main.result == 'success' }}
        with:
          script: |
            const title = "develop CI failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const outcome =
              process.env.MERGED === "true"
                ? "and main has been fast-forwarded."
                : "(main was not moved: dispatch this workflow on develop to fast-forward it).";
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((i) => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Develop CI is green again on \`${context.sha.slice(0, 7)}\` ${outcome} ${runUrl}`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              core.info(`Closed #${issue.number}`);
            }
