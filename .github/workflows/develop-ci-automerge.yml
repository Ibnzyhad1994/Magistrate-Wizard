name: Develop CI + Auto-merge to Main

# On every push to `develop`: lint, typecheck, run the script test suite,
# build, run the Playwright smokes (reused from e2e.yml), and if it is all
# green, fast-forward `main` to match and push — which is what triggers the
# production Vercel deployment.
#
# The script suite is `npm test` (scripts/test-support/run-all.mjs). It
# discovers every scripts/tests/test-*.mjs and skips anything tagged
# `// @live-db` (needs a real Supabase project) or `// @slow` (the "brutal"
# stress variants). Those run on demand with `npm run test:live` /
# `npm run test:slow`. Hosted preview/prod drift is checked read-only by
# schema-alignment.yml so a lagging remote cannot freeze this merge.
#
# The merge is fast-forward-only. If `main` has commits `develop` doesn't
# (i.e. someone pushed directly to main out of band), the merge step fails
# loudly instead of guessing how to reconcile history — fix that by rebasing
# develop onto main, don't change this workflow to force it. main-drift.yml
# raises the alarm when main trails develop for more than a day or so.
#
# A failed run opens (or comments on) a GitHub issue titled "develop CI
# failing"; the next green run closes it.

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: develop-ci
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: npm audit (critical — blocking)
        run: npm audit --audit-level=critical

      # High advisories are reported in the log but do not fail the gate while
      # the tree still carries known transitive findings. Dependabot opens
      # weekly PRs to work them down.
      - name: npm audit (high — report only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Script test suite (npm test)
        run: npm test

      - name: Schema alignment (repo uniqueness and contracts)
        env:
          SCHEMA_ALIGN_SKIP_LIVE: "1"
        run: npm run test:schema-alignment

      - name: Build (catches anything the type checker alone would miss)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

  # Playwright smokes (unauth against Vite only; auth against local Supabase
  # + seed). Reused from e2e.yml so PRs and the develop gate run the same jobs.
  e2e:
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read

  merge-to-main:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Fast-forward main to develop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin develop
          git merge --ff-only origin/develop
          git push origin main

  notify-failure:
    needs: [test, e2e, merge-to-main]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "develop CI failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Develop CI failed on \`${context.sha.slice(0, 7)}\`.`,
              "",
              `Run: ${runUrl}`,
              "",
              "`main` will not be fast-forwarded until develop is green again.",
              "This issue is closed automatically by the next successful run.",
            ].join("\n");
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request);
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body });
              core.info(`Commented on #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({ ...context.repo, title, body });
              core.info(`Opened #${created.number}`);
            }

  notify-recovered:
    needs: [merge-to-main]
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = "develop CI failing";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            for (const issue of issues.filter((i) => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Develop CI is green again on \`${context.sha.slice(0, 7)}\` and main has been fast-forwarded. ${runUrl}`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              core.info(`Closed #${issue.number}`);
            }
