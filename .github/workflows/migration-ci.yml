name: Migration CI

# Apply every committed SQL migration against a fresh local Postgres.
# Fast develop CI never starts Docker; this job is the apply-break gate.
# Seed is skipped so the job measures schema apply, not fixture load.
# Hosted preview/prod drift is a separate read-only workflow
# (.github/workflows/schema-alignment.yml), not this apply job.
#
# After applying, it dumps the public schema and fails when the dump differs
# from the committed supabase/schema.sql (BE-20), so every commit carries one
# readable copy of every table, policy and function body, including those
# that migrations rewrite in place. After a schema change, regenerate it with
# `npm run db:schema-snapshot` against a freshly reset local stack, or take
# the public-schema artifact of the failed run, and commit it with the
# migration.
#
# Runs on EVERY develop push (not only when supabase/** changes): a frontend
# commit that depends on a hosted-only schema change is otherwise never
# caught. PRs keep the path filter.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/schema.sql"
      - ".github/workflows/migration-ci.yml"
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  apply-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      # This job skips npm ci, so name the CLI version package.json pins
      # rather than let npx fetch whatever is newest.
      - name: Pinned Supabase CLI
        run: echo "SUPABASE_CLI=supabase@$(node -p "require('./package.json').devDependencies.supabase")" >> "$GITHUB_ENV"

      - name: Start local database
        run: npx --yes "$SUPABASE_CLI" db start

      - name: Reset and apply all migrations (no seed)
        run: npx --yes "$SUPABASE_CLI" db reset --yes --no-seed

      - name: Public schema matches supabase/schema.sql
        run: |
          npx --yes "$SUPABASE_CLI" db dump --local --schema public -f "$RUNNER_TEMP/schema.sql"
          if ! diff -u supabase/schema.sql "$RUNNER_TEMP/schema.sql" > "$RUNNER_TEMP/schema.diff"; then
            head -n 200 "$RUNNER_TEMP/schema.diff"
            echo "::error file=supabase/schema.sql::The applied public schema differs from supabase/schema.sql. Run npm run db:schema-snapshot on a freshly reset local stack (or take this run's public-schema artifact) and commit it."
            exit 1
          fi

      - name: Upload the applied public schema
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-schema
          path: ${{ runner.temp }}/schema.sql
          if-no-files-found: ignore
