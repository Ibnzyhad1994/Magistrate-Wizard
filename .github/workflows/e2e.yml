name: Playwright smokes

# Runs on pull requests, and is reused (workflow_call) by
# develop-ci-automerge.yml so the develop gate has the same browser coverage
# and main is never fast-forwarded past a failing smoke.
# Unauth job starts Vite only. Auth job starts local Supabase + seed and runs
# every spec except unauth.spec.ts (see `test:e2e:auth` in package.json), so
# new authenticated specs are picked up without editing this file.

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  smoke-unauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unauthenticated smokes
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:56321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8ifQ.e2e
          CI: true
        run: npm run test:e2e:unauth

  smoke-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Supabase CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Start local Supabase
        run: npx supabase start

      - name: Write Vite env from local Supabase
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } | tee .env >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated smokes (every spec except unauth)
        env:
          CI: true
        run: npm run test:e2e:auth
