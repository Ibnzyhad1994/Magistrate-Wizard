name: Playwright smokes

# PR-only. Kept off develop-ci-automerge so that gate stays Docker-free.
# Unauth job starts Vite only. Auth job starts local Supabase + seed.

on:
  pull_request:

permissions:
  contents: read

jobs:
  smoke-unauth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Unauthenticated smokes
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:56321
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8ifQ.e2e
          CI: true
        run: npm run test:e2e:unauth

  smoke-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install -g npm@11.6.2
          npm ci

      - name: Cache Supabase CLI
        uses: actions/cache@v4
        with:
          path: ~/.supabase
          key: supabase-cli-${{ runner.os }}-${{ hashFiles('supabase/config.toml') }}

      - name: Start local Supabase
        run: npx supabase start

      - name: Write Vite env from local Supabase
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "VITE_SUPABASE_URL=${API_URL}"
            echo "VITE_SUPABASE_ANON_KEY=${ANON_KEY}"
          } | tee .env >> "$GITHUB_ENV"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Authenticated smokes
        env:
          CI: true
        run: npm run test:e2e:auth
