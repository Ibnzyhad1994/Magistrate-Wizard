  <!-- dashed association -->
  <path d="M540 400 L920 187" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M540 400 L920 267" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <path d="M540 415 L920 347" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="40" y="760" width="1320" height="100" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="64" y="798" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e3a5f" font-weight="700">Solid line</text>
  <text x="160" y="798" font-family="Segoe UI, sans-serif" font-size="13" fill="#64748b">parent / child or ownership</text>
  <text x="64" y="826" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e3a5f" font-weight="700">Dashed line</text>
  <text x="170" y="826" font-family="Segoe UI, sans-serif" font-size="13" fill="#64748b">association table - BOTH sides already readable, never confers access</text>
  <text x="64" y="852" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Legacy cases / case_parties omitted - unused by new development. legal_authority_courts is a separate "reported court" list, not courts.</text>
</svg>
