  <rect x="920" y="640" width="210" height="54" rx="8" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="1025" y="674" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e3a5f">documents / bookmarks</text>

  <rect x="1170" y="220" width="190" height="48" rx="8" fill="#ffffff" stroke="#6d28d9"/>
  <text x="1265" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5b21b6">annotations</text>
  <rect x="1170" y="160" width="190" height="48" rx="8" fill="#ffffff" stroke="#047857"/>
  <text x="1265" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#065f46">judgment_tags</text>

  <!-- solid links -->
  <path d="M140 154 L140 200" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M140 254 L140 300" stroke="#1e3a5f" stroke-width="1.5"/>
  <path d="M240 327 L320 227" stroke="#1e3a5f" stroke-width="1.5"/>
