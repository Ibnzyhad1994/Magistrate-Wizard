<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="64" y="48" font-family="Georgia, serif" font-size="26" fill="#1e40af" font-weight="700">A sitting day vs an admin day</text>
  <text x="64" y="74" font-family="Segoe UI, sans-serif" font-size="13" fill="#64748b">Left to right in time. Same product, different keys.</text>

  <!-- Lane headers -->
  <rect x="48" y="100" width="140" height="180" rx="8" fill="#fed7aa" stroke="#c2410c"/>
  <text x="118" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#9a3412" font-weight="700">Magistrate</text>
  <rect x="48" y="292" width="140" height="180" rx="8" fill="#ddd6fe" stroke="#6d28d9"/>
  <text x="118" y="390" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5b21b6" font-weight="700">Administrator</text>
  <rect x="48" y="484" width="140" height="160" rx="8" fill="#dbeafe" stroke="#1e3a5f"/>
  <text x="118" y="572" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e3a5f" font-weight="700">Database</text>

  <!-- Magistrate steps -->
  <rect x="220" y="130" width="200" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="320" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#9a3412" font-weight="600">Sign in</text>
  <text x="320" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Dashboard</text>

  <rect x="450" y="130" width="200" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="550" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#9a3412" font-weight="600">Open today's list</text>
  <text x="550" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Court docket + retained</text>

  <rect x="680" y="130" width="200" height="70" rx="8" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="780" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#9a3412" font-weight="600">Hear the matter</text>
  <text x="780" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">event  ·  parties  ·  orders</text>

  <rect x="910" y="130" width="200" height="70" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="1010" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#065f46" font-weight="600">Write / pin / note</text>
  <text x="1010" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">judgment stays yours</text>

  <path d="M420 165 L450 165" stroke="#c2410c" stroke-width="2" marker-end="url(#m)"/>
  <path d="M650 165 L680 165" stroke="#c2410c" stroke-width="2" marker-end="url(#m)"/>
  <path d="M880 165 L910 165" stroke="#c2410c" stroke-width="2" marker-end="url(#m)"/>

  <!-- Admin steps -->
  <rect x="220" y="330" width="200" height="70" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="320" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5b21b6" font-weight="600">Seat a magistrate</text>
  <text x="320" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">Court Assignments</text>

  <rect x="450" y="330" width="200" height="70" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="550" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5b21b6" font-weight="600">Import an authority</text>
  <text x="550" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">hidden draft</text>

  <rect x="680" y="330" width="200" height="70" rx="8" fill="#ffffff" stroke="#6d28d9" stroke-width="2"/>
  <text x="780" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#5b21b6" font-weight="600">Review metadata</text>
  <text x="780" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">court  ·  citation  ·  tags</text>

  <rect x="910" y="330" width="200" height="70" rx="8" fill="#a7f3d0" stroke="#047857" stroke-width="2"/>
  <text x="1010" y="358" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#065f46" font-weight="600">Publish</text>
  <text x="1010" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">library becomes readable</text>

  <path d="M420 365 L450 365" stroke="#6d28d9" stroke-width="2" marker-end="url(#p)"/>
  <path d="M650 365 L680 365" stroke="#6d28d9" stroke-width="2" marker-end="url(#p)"/>
  <path d="M880 365 L910 365" stroke="#6d28d9" stroke-width="2" marker-end="url(#p)"/>

  <!-- DB -->
  <rect x="220" y="520" width="430" height="90" rx="8" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="435" y="556" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#1e3a5f" font-weight="600">RLS filters every read and write</text>
  <text x="435" y="580" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Admin publish ` Admin docket access</text>

  <rect x="680" y="520" width="430" height="90" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="895" y="556" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#991b1b" font-weight="600">No back door</text>
  <text x="895" y="580" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">Private judgments, notes, codes stay closed</text>

  <defs>
    <marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6d28d9"/></marker>
  </defs>
</svg>
