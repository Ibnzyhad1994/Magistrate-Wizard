<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img">
  <rect width="1280" height="640" fill="#ffffff"/>
  <text x="64" y="48" font-family="Georgia, serif" font-size="28" fill="#1e40af" font-weight="700">System context</text>
  <text x="64" y="74" font-family="Segoe UI, sans-serif" font-size="14" fill="#64748b">Magistrate Wizard is one web app. Supabase is the only backend. Outlook is future.</text>

  <!-- People -->
  <ellipse cx="160" cy="220" rx="88" ry="48" fill="#fed7aa" stroke="#c2410c" stroke-width="2"/>
  <text x="160" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#9a3412" font-weight="700">Magistrate</text>
  <text x="160" y="236" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">sits  ·  writes  ·  researches</text>

  <ellipse cx="160" cy="340" rx="88" ry="48" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="160" y="336" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#92400e" font-weight="700">Clerk</text>
  <text x="160" y="356" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">share recipient today</text>

  <ellipse cx="160" cy="460" rx="88" ry="48" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="160" y="456" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#5b21b6" font-weight="700">Admin</text>
  <text x="160" y="476" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">roster + library</text>

  <!-- System -->
  <rect x="420" y="200" width="360" height="280" rx="16" fill="#dbeafe" stroke="#1e3a5f" stroke-width="3"/>
  <text x="600" y="250" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#1e3a5f" font-weight="700">Magistrate Wizard</text>
  <text x="600" y="280" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e40af">React SPA   ·   Magistrate Wizard</text>
  <text x="600" y="330" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#374151">Court-anchored Docket</text>
  <text x="600" y="354" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#374151">Personally owned work product</text>
  <text x="600" y="378" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#374151">Published legal library</text>
  <text x="600" y="430" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">Privacy is enforced in the database</text>

  <!-- Externals -->
  <rect x="940" y="140" width="260" height="80" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="1070" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e3a5f" font-weight="700">Supabase Auth</text>
  <text x="1070" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">email session  ·  profiles</text>

  <rect x="940" y="250" width="260" height="80" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="1070" y="284" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e3a5f" font-weight="700">Postgres + RLS</text>
  <text x="1070" y="306" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">product of record</text>

  <rect x="940" y="360" width="260" height="80" rx="10" fill="#ffffff" stroke="#1e3a5f" stroke-width="2"/>
  <text x="1070" y="394" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e3a5f" font-weight="700">Storage</text>
  <text x="1070" y="416" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">documents private  ·  avatars public</text>

  <rect x="940" y="470" width="260" height="80" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="1070" y="504" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#64748b" font-weight="700">Outlook (future)</text>
  <text x="1070" y="526" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">appearance times only</text>

  <path d="M248 220 L420 300" stroke="#c2410c" stroke-width="2" fill="none"/>
  <path d="M248 340 L420 340" stroke="#b45309" stroke-width="2" fill="none"/>
  <path d="M248 460 L420 400" stroke="#6d28d9" stroke-width="2" fill="none"/>
  <path d="M780 260 L940 180" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <path d="M780 330 L940 290" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <path d="M780 400 L940 400" stroke="#1e3a5f" stroke-width="2" fill="none"/>
  <path d="M780 450 L940 500" stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="6 4"/>

  <text x="64" y="610" font-family="Segoe UI, sans-serif" font-size="12" fill="#64748b">No Edge Functions in production today. Search and ingestion RPCs run inside Postgres.</text>
</svg>
